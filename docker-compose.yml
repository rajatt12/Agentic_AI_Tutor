services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_tutor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rajat123
      POSTGRES_DB: ai_tutor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
